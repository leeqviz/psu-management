name: Next.js CI

# 1. Trigger the workflow on push events
on:
  push:
    branches: ["dev"] # Change "main" to your target branch (e.g., "develop")
  pull_request:
    branches: ["dev"] # Optional: Also trigger on PRs to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x] # Define the Node.js version(s) you use

    steps:
      # 2. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Setup Node.js environment
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # Automatically caches dependencies for faster runs

      # 4. Install dependencies (clean install)
      - name: Install dependencies
        run: npm ci

      # 5. Run ESLint
      - name: Run Lint
        run: npm run lint

      # 6. Run Jest Tests
      - name: Run Tests
        run: npm run test

      # 7. Build the Next.js application
      - name: Run Build
        run: npm run build
